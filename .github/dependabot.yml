version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix(deps)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    target-branch: dev
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(ci)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
